[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every path has to serve index.html so a Home Screen launch
# or a shared link opens the app instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or phones keep running an old build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    # Netlify would otherwise serve this as application/octet-stream, which
    # stops browsers treating it as an installable app manifest.
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
